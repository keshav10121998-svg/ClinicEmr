spring:
  application:
    name: clinic-emr
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinic_emr}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD:clinic}
    hikari:
      # Hosted free databases (e.g. Supabase's pooler) allow only a few connections per client
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:18080}
  error:
    include-message: never

app:
  security:
    # HMAC key for staff JWTs. Must be at least 32 bytes. Override in every non-local environment.
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
    token-ttl: PT12H
  storage:
    # s3: any S3-compatible store (MinIO from docker-compose, or Oracle Object Storage, see README).
    # local: files on this machine's disk, for development only (the dev server uses this by default).
    type: ${STORAGE_TYPE:s3}
    # proxy: uploads go through the backend, which checks file contents; no bucket CORS needed.
    # direct: browsers PUT to pre-signed URLs (S3 only; the bucket must allow the front-end origin).
    upload-mode: ${STORAGE_UPLOAD_MODE:proxy}
    local-dir: ${STORAGE_LOCAL_DIR:target/dev-storage}
    # The app's public address, for download links the backend serves itself (local storage, or download-mode proxy)
    local-base-url: ${PUBLIC_BASE_URL:${STORAGE_LOCAL_BASE_URL:http://localhost:18080}}
    # presigned: links straight to the store. proxy: files are streamed through the backend (any S3-compatible store).
    download-mode: ${STORAGE_DOWNLOAD_MODE:presigned}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:ap-mumbai-1}
    bucket: ${STORAGE_BUCKET:clinic-emr-documents}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    path-style: ${STORAGE_PATH_STYLE:true}
    presign-ttl: PT5M
    max-file-bytes: 20971520

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
