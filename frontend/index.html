<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d6b5a" />
    <meta name="description" content="Patients, visits, prescriptions and payments for your clinic." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Patients (/my) install their own "My health" app; clinic staff install ClinicEMR -->
    <script>
      (function () {
        var mine = location.pathname === '/my' || location.pathname.indexOf('/my/') === 0;
        document.write('<link rel="manifest" href="' + (mine ? '/manifest-my.json' : '/manifest.json') + '" />'
          + '<meta name="apple-mobile-web-app-title" content="' + (mine ? 'My health' : 'ClinicEMR') + '" />');
      })();
    </script>
    <title>ClinicEMR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
