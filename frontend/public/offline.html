<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d6b5a" />
  <title>ClinicEMR - No internet</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7f6; color: #1d2b27;
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 1.3rem; margin: 16px 0 4px; }
    p { margin: 0 0 20px; color: #5b6b66; }
    button { font: inherit; font-weight: 600; color: #fff; background: #0d6b5a; border: 0; border-radius: 10px; padding: 12px 28px; min-height: 48px; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" />
    <h1>No internet connection</h1>
    <p>ClinicEMR needs the internet to open records.<br />Check mobile data or Wi-Fi.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
